# Configurazione per Fly.io. Regione: Milano.
app = "solvia"
primary_region = "mil"

[build]

[env]
  NODE_ENV = "production"
  PORT = "3000"
  SOLVIA_DATA_DIR = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.checks]
    [[http_service.checks.http]]
      path = "/api/health"
      interval = "30s"
      timeout = "5s"

# Disco persistente: senza, il database viene azzerato a ogni deploy.
# Crealo con: fly volumes create solvia_data --size 1 --region mil
[[mounts]]
  source = "solvia_data"
  destination = "/data"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
