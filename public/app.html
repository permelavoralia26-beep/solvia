<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solvia — Area di lavoro</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#4F46E5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Solvia">
<link rel="apple-touch-icon" href="/icon-192.png">

<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div class="shell">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <svg viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="#4F46E5"/><path d="M34 14 L20 36 H30 L28 50 L44 28 H34 L34 14 Z" fill="#fff"/><circle cx="47" cy="17" r="3.2" fill="#5EEAD4"/></svg>
      Solvia
    </div>

    <nav class="nav" id="nav">
      <button class="nav-item active" data-view="dashboard">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        Dashboard
      </button>
      <button class="nav-item" data-view="inbox">
        <svg viewBox="0 0 24 24"><path d="M3 6h18v12H3z"/><path d="M3 7l9 7 9-7"/></svg>
        Inbox
        <span class="nav-count hidden" id="count-inbox">0</span>
      </button>
      <button class="nav-item" data-view="tasks">
        <svg viewBox="0 0 24 24"><path d="M9 11l2.5 2.5L16 8"/><rect x="3" y="4" width="18" height="16" rx="2.5"/></svg>
        Attività
        <span class="nav-count hidden" id="count-tasks">0</span>
      </button>
      <button class="nav-item" data-view="quotes">
        <svg viewBox="0 0 24 24"><path d="M6 3h12v18H6z"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>
        Preventivi
      </button>
      <button class="nav-item" data-view="invoices">
        <svg viewBox="0 0 24 24"><path d="M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>
        Fatture
      </button>
      <button class="nav-item" data-view="recurring">
        <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 01-9 9 9 9 0 01-8.5-6"/><path d="M3 12a9 9 0 019-9 9 9 0 018.5 6"/><path d="M21 3v6h-6M3 21v-6h6"/></svg>
        Ricorrenti
      </button>
      <button class="nav-item" data-view="reminders">
        <svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg>
        Solleciti
        <span class="nav-count hidden" id="count-reminders">0</span>
      </button>
      <button class="nav-item" data-view="time">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg>
        Ore
        <span class="nav-count hidden" id="count-time">0</span>
      </button>
      <button class="nav-item" data-view="expenses">
        <svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="13" rx="2"/><path d="M2 10h20"/></svg>
        Spese
      </button>
      <button class="nav-item" data-view="tax">
        <svg viewBox="0 0 24 24"><path d="M12 2v20M7 6h8a3 3 0 010 6H9a3 3 0 000 6h8"/></svg>
        Tasse
      </button>
      <button class="nav-item" data-view="clients">
        <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M16 8.5a3 3 0 000 5M18 14c2.2.6 3 2.3 3 4"/></svg>
        Clienti
      </button>
      <button class="nav-item" data-view="settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.6 1.6 0 00-1.8-.3 1.6 1.6 0 00-1 1.5V21a2 2 0 11-4 0v-.1A1.6 1.6 0 007 19.4a1.6 1.6 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.6 1.6 0 00.3-1.8 1.6 1.6 0 00-1.5-1H1a2 2 0 110-4h.1A1.6 1.6 0 002.6 7a1.6 1.6 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.6 1.6 0 001.8.3H7a1.6 1.6 0 001-1.5V1a2 2 0 114 0v.1a1.6 1.6 0 001 1.5 1.6 1.6 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.6 1.6 0 00-.3 1.8V7a1.6 1.6 0 001.5 1H21a2 2 0 110 4h-.1a1.6 1.6 0 00-1.5 1z"/></svg>
        Impostazioni
      </button>
    </nav>

    <div class="sidebar-foot">
      <div class="user-chip">
        <div class="avatar" id="user-initials">—</div>
        <div>
          <strong id="user-name">…</strong>
          <span id="user-email"></span>
        </div>
      </div>
      <button class="btn btn-ghost btn-sm btn-block" id="logout">Esci</button>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:12px;min-width:0;">
        <button class="menu-toggle" id="menu-toggle" aria-label="Apri menu">
          <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18" stroke-linecap="round"/></svg>
        </button>
        <div style="min-width:0;">
          <h1 id="page-title">Dashboard</h1>
          <div class="sub" id="page-sub"></div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        <button class="search-trigger" id="search-trigger">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <span>Cerca…</span><kbd>Ctrl K</kbd>
        </button>
        <button class="btn btn-ghost btn-sm hidden" id="install-app">Installa app</button>
        <button class="theme-toggle" id="theme-toggle" aria-label="Cambia tema"></button>
        <div class="topbar-actions" id="page-actions"></div>
      </div>
    </div>

    <div class="content" id="content">
      <div class="loading"><div class="spinner dark"></div></div>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal" id="modal">
    <div class="modal-head">
      <h2 id="modal-title">Titolo</h2>
      <button class="modal-close" id="modal-close" aria-label="Chiudi">&times;</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-foot" id="modal-foot"></div>
  </div>
</div>


<div class="search-backdrop" id="search-backdrop">
  <div class="search-box">
    <div class="search-input-row">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input type="text" id="search-input" placeholder="Cerca clienti, fatture, preventivi, attività…" autocomplete="off">
      <kbd>esc</kbd>
    </div>
    <div class="search-results" id="search-results"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/js/app.js"></script>
</body>
</html>
