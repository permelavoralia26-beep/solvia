<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuova password — Solvia</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="theme-color" content="#4F46E5">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/css/styles.css">
<style>
  body{display:flex;align-items:center;justify-content:center;padding:24px;
       background:linear-gradient(160deg,#EEF2FF 0%,#F8FAFC 45%);}
  .auth{width:100%;max-width:420px;}
  .auth-brand{display:flex;align-items:center;justify-content:center;gap:10px;
              font-weight:800;font-size:24px;margin-bottom:8px;}
  .auth-brand svg{width:38px;height:38px;border-radius:10px;}
  .auth-sub{text-align:center;color:var(--muted);font-size:14.5px;margin-bottom:26px;}
  .auth-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;
             padding:28px;box-shadow:var(--shadow);}
  .back{display:block;text-align:center;margin-top:20px;font-size:13.5px;color:var(--muted);}
</style>
</head>
<body>
<div class="auth">
  <div class="auth-brand">
    <svg viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="#4F46E5"/><path d="M34 14 L20 36 H30 L28 50 L44 28 H34 L34 14 Z" fill="#fff"/><circle cx="47" cy="17" r="3.2" fill="#5EEAD4"/></svg>
    Solvia
  </div>
  <p class="auth-sub">Scegli una nuova password</p>

  <div class="auth-card">
    <div class="alert alert-error" id="err"></div>
    <div class="alert alert-ok" id="ok"></div>

    <div id="caricamento" class="loading"><div class="spinner dark"></div></div>

    <form id="form" class="hidden">
      <div class="field">
        <label for="p1">Nuova password</label>
        <input class="input" type="password" id="p1" autocomplete="new-password" required minlength="8">
        <p class="hint">Almeno 8 caratteri.</p>
      </div>
      <div class="field">
        <label for="p2">Ripetila</label>
        <input class="input" type="password" id="p2" autocomplete="new-password" required minlength="8">
      </div>
      <button class="btn btn-primary btn-block" type="submit" id="salva">Salva la nuova password</button>
      <p class="hint" style="margin-top:14px">Salvando, tutte le sessioni aperte altrove
        vengono disconnesse.</p>
    </form>

    <div id="scaduto" class="hidden">
      <p style="font-size:14.5px;line-height:1.65;color:var(--ink-2)">
        Questo link non è più valido: vale un'ora e una volta sola.
        Chiedine uno nuovo dalla pagina di accesso.
      </p>
      <a class="btn btn-primary btn-block" href="/accedi" style="margin-top:18px">Vai all'accesso</a>
    </div>
  </div>

  <a class="back" href="/accedi">← Torna all'accesso</a>
</div>

<script>
const err = document.getElementById('err');
const ok = document.getElementById('ok');
const showErr = (m) => { err.textContent = m; err.classList.add('show'); };

const token = new URLSearchParams(window.location.search).get('token') || '';
const mostra = (id) => document.getElementById(id).classList.remove('hidden');
const nascondi = (id) => document.getElementById(id).classList.add('hidden');

(async function verifica() {
  try {
    const res = await fetch('/api/auth/password/verifica?token=' + encodeURIComponent(token));
    const data = await res.json();
    nascondi('caricamento');
    if (data.valido) mostra('form');
    else mostra('scaduto');
  } catch {
    nascondi('caricamento');
    mostra('scaduto');
  }
})();

document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  err.classList.remove('show');
  const p1 = document.getElementById('p1').value;
  const p2 = document.getElementById('p2').value;
  if (p1 !== p2) return showErr('Le due password non coincidono');

  const btn = document.getElementById('salva');
  btn.disabled = true;
  btn.textContent = 'Salvataggio…';
  try {
    const res = await fetch('/api/auth/password/reimposta', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, password: p1 }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Operazione non riuscita');
    nascondi('form');
    ok.textContent = 'Password aggiornata. Ti porto all’accesso…';
    ok.classList.add('show');
    setTimeout(() => { window.location.href = '/accedi'; }, 1600);
  } catch (e2) {
    showErr(e2.message);
    btn.disabled = false;
    btn.textContent = 'Salva la nuova password';
  }
});
</script>
</body>
</html>
